name: Sincronizar Status BSoft

on:
  push:
    branches: [main]
    paths:
      - 'fila-status/pendentes/**'
  workflow_dispatch:
    inputs:
      modo_seco:
        description: 'Modo seco (nao grava, so simula)'
        type: boolean
        default: false
      itens_json:
        description: 'Array JSON opcional de itens pra aplicar direto (ex.: [{"placa":"AXW-6J08","bsoftAberto":true,"mdfe":"899"}])'
        type: string
        default: ''

concurrency:
  group: sync-status-bsoft
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sincronizar status pendentes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MODO_SECO: ${{ github.event.inputs.modo_seco }}
          ITENS_JSON: ${{ github.event.inputs.itens_json }}
        run: node scripts/sync-status-bsoft.js

      - name: Commitar fila processada
        run: |
          git config user.name "robo-sync-status-bsoft"
          git config user.email "actions@users.noreply.github.com"
          if [ -d fila-status ]; then
            git add fila-status/
            if ! git diff --cached --quiet; then
              git commit -m "robo-sync-status-bsoft: fila processada [skip ci]"
              git push
            else
              echo "Nada para commitar."
            fi
          else
            echo "Pasta fila-status/ nao existe neste commit. Nada a fazer."
          fi
