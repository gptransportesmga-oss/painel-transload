name: Painel Motor (rastreio + status automatico, sem navegador)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      modo_seco:
        description: 'Modo seco (busca tudo e mostra o que faria, mas nao grava no Supabase)'
        type: boolean
        default: false

concurrency:
  group: painel-motor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rodar o motor do painel
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CA2_USUARIO: ${{ secrets.CA2_USUARIO }}
          CA2_SENHA: ${{ secrets.CA2_SENHA }}
          MODO_SECO: ${{ github.event.inputs.modo_seco || 'false' }}
        run: node scripts/painel-motor.js
