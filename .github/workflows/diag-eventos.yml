name: Diagnostico eventos Ca2Track (descartavel)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: America/Sao_Paulo
      NODE_OPTIONS: --dns-result-order=ipv4first
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rodar diagnostico
        env:
          CA2_USUARIO: ${{ secrets.CA2_USUARIO }}
          CA2_SENHA: ${{ secrets.CA2_SENHA }}
        run: node scripts/diag-eventos.js
